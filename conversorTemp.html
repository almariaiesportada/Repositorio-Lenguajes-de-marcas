<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Conversor de Temperatura</title>
</head>

<body>

    <h2>Conversor de Temperatura</h2>

    <input type="number" id="valor" placeholder="Temperatura">

    <select id="tipo">
        <option value="CtoF">Celsius a Fahrenheit</option>
        <option value="FtoC">Fahrenheit a Celsius</option>
    </select>

    <button onclick="convertir()">Convertir</button>

    <p id="resultado"></p>

    <script>
        function convertirTemperatura(valor, tipo) {

            if (tipo === "CtoF") {
                return (valor * 9 / 5 + 32).toFixed(2);

            } else if (tipo === "FtoC") {
                return ((valor - 32) * 5 / 9).toFixed(2);

            } else {
                return "Tipo de conversión no válido";
            }
        }

        function convertir() {
            const valor = document.getElementById("valor").value;
            const tipo = document.getElementById("tipo").value;

            const resultado = convertirTemperatura(valor, tipo);

            document.getElementById("resultado").textContent = "Resultado: " + resultado;
        }
    </script>

</body>

</html>
