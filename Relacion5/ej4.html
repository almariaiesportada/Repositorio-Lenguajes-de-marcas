<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //Array con las letras del DNI
        var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N',
            'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'];

        //Pedimos al usuario que introduzca el número y la letra del DNI
        var dniNumero = parseInt(window.prompt("Introduce el número de tu DNI (sin la letra):"));
        var dniLetra = window.prompt("Introduce la letra de tu DNI:").toUpperCase(); // Convertimos a mayúscula

        //Comprobamos si el número es válido dentro del rango
        if (dniNumero < 0 || dniNumero > 99999999) {
            alert("El número de DNI proporcionado no es válido.");
        } 
        else {
            //Si no calculamos la letra correcta según el resto de la división entre 23
            var letraCorrecta = letras[dniNumero % 23];

            //Comparamos la letra calculada con la letra introducida por el usuario
            if (letraCorrecta !== dniLetra) {
                alert("La letra que has indicado no es correcta. La letra correcta sería: " + letraCorrecta);
            } else {
                alert("El número y la letra del DNI son correctos.");
            }
        }
    </script>
</body>

</html>
