<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora simple</title>
</head>

<body>
    <p>Escribe una fórmula matemática, por ejemplo: (2+3)*10</p>
    <input type="text" id="formula" placeholder="Ingresa la fórmula">
    <input type="button" value="Calcular" onclick="calcular()">
    <p>Resultado: <span id="resultado"></span></p>

    <script>
        //Funcion que calcula la fórmula que el usuario haya introducido en el input
        function calcular() {
            const formula = document.getElementById("formula").value;
            let resultado;
            //Funcion que evalua la fórmula y la mete en resultado para mostrarla
            resultado = eval(formula);
            document.getElementById("resultado").textContent = resultado;
        }
    </script>
</body>

</html>
