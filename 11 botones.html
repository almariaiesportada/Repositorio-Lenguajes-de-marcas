<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Calcula(numero)
        {
            let calculo;
            calculo = numero * numero;
            document.writeln(`<p> Resultado del cuadrado de ese número es = ${calculo} </p>`);
        }
    </script>
</head>
<body>
    <input type="button" onclick="Calcula(3)" value="Calculo">
    <input type="button" ondblclick="Calcula(5)" value="Otro Calculo">
</body>
</html>
